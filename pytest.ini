[pytest]
testpaths = tests simulator/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    sitl: Integration tests that require a live ArduPilot/PX4 SITL process. Auto-skipped when SITL is unreachable.
    asyncio: Mark a test as an asyncio coroutine test.
